[package]
name = "homeroom"
version = "0.2.0"
description = "Homeroom personal dashboard"
authors = ["Alamin"]
license = "MIT"
edition = "2021"

[lib]
name = "homeroom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri = { version = "2", features = [] }
rfd = "0.15"
walkdir = "2"
open = "5"
